name: Build Android APK & App Bundle

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to attach artifacts to
        required: false
        default: v2.5.0

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "UPDATE_CHECK_URL=https://raw.githubusercontent.com/if12is/Mo-Music/master/distribution/update-check.json" > .env
          else
            echo "${{ secrets.ENV_FILE }}" > .env
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Firebase Config (Google Services)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "Decoding google-services.json..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          else
            echo "No custom google-services.json secret found. Using dummy configuration..."
            echo '{"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:abc123def456","android_client_info":{"package_name":"com.if12is.momusic"}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/configure-android-signing.sh

      - name: Build Split APKs
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p build-artifacts
          cp build/app/outputs/flutter-apk/*-release.apk build-artifacts/
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')"
            cp "$apk" "build-artifacts/MoMusic-android-${abi}.apk"
          done

      - name: Build Universal APK
        run: |
          flutter clean
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build-artifacts/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build-artifacts/MoMusic-android-universal.apk

      - name: Build App Bundle (AAB)
        run: |
          flutter clean
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab build-artifacts/app-release.aab
          cp build/app/outputs/bundle/release/app-release.aab build-artifacts/MoMusic-android.aab

      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-split-apks
          path: |
            build-artifacts/app-*-release.apk
            build-artifacts/MoMusic-android-arm*.apk
            build-artifacts/MoMusic-android-x86_64.apk

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: android-universal-apk
          path: |
            build-artifacts/app-release.apk
            build-artifacts/MoMusic-android-universal.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: |
            build-artifacts/app-release.aab
            build-artifacts/MoMusic-android.aab

      - name: Upload binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          files: build-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
