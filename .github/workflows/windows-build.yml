name: Build Windows Application

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        shell: bash
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "UPDATE_CHECK_URL=https://raw.githubusercontent.com/if12is/Mo-Music/dev/distribution/update-check.json" > .env
          else
            echo "${{ secrets.ENV_FILE }}" > .env
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $Version = (Select-String -Path "pubspec.yaml" -Pattern "version:\s*(.*)").Matches.Groups[1].Value.Split("+")[0].Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$Version" "distribution/compilador.iss"

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "distribution/MoMusic-windows-portable.zip" -Force

      - name: Upload Installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: distribution/MoMusic-windows-installer.exe

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-zip
          path: distribution/MoMusic-windows-portable.zip

      - name: Upload binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            distribution/MoMusic-windows-installer.exe
            distribution/MoMusic-windows-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
