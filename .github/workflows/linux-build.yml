name: Build Linux Application

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "UPDATE_CHECK_URL=https://raw.githubusercontent.com/if12is/Mo-Music/master/distribution/update-check.json" > .env
          else
            echo "${{ secrets.ENV_FILE }}" > .env
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjson-glib-dev libayatana-appindicator3-dev libmpv-dev mpv flatpak flatpak-builder

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Build Flatpak Package
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          cd distribution/flatpak
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir com.josprox.EstrellaMusic.yml || true
          if [ -d repo ]; then
            flatpak build-bundle repo MoMusic.flatpak com.josprox.EstrellaMusic || true
            if [ -f MoMusic.flatpak ]; then
              mv MoMusic.flatpak ../MoMusic-linux-x64.flatpak
            fi
          fi

      - name: Package Portable Tarball
        run: |
          mkdir -p distribution
          tar -czvf distribution/MoMusic-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: distribution/MoMusic-linux*

      - name: Upload binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: distribution/MoMusic-linux*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

