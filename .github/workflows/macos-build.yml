name: Build macOS Application

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to attach artifacts to
        required: false
        default: v2.5.0

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "UPDATE_CHECK_URL=https://raw.githubusercontent.com/if12is/Mo-Music/master/distribution/update-check.json" > .env
          else
            echo "${{ secrets.ENV_FILE }}" > .env
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch audiotags podspec typo
        run: |
          find ~/.pub-cache -name "audiotags.podspec" -exec perl -pi -e 's/if \[ ! -d ios.zip \]d/if [ ! -f ios.zip ]/g' {} +

      - name: Configure CocoaPods Environment
        run: |
          cd macos
          pod repo update
          pod install

      - name: Build macOS Application
        run: flutter build macos --release

      - name: Package Portable ZIP
        run: |
          mkdir -p distribution
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" distribution/MoMusic-macos.zip
          cp distribution/MoMusic-macos.zip distribution/MoMusic_macOS_Portable.zip

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-portable-zip
          path: |
            distribution/MoMusic-macos.zip
            distribution/MoMusic_macOS_Portable.zip

      - name: Upload binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          files: |
            distribution/MoMusic-macos.zip
            distribution/MoMusic_macOS_Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
